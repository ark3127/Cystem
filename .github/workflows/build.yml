name: Build CYSTEM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter project
        run: |
          test -f pubspec.yaml
          flutter --version

      - name: Generate Android project
        run: |
          flutter create --platforms=android .

      - name: Configure Android project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_kts = Path("android/app/build.gradle.kts")
          gradle_groovy = Path("android/app/build.gradle")

          if gradle_kts.exists():
              path = gradle_kts
              text = path.read_text()
              text = re.sub(
                  r"compileSdk\s*=\s*[^\n]+",
                  "compileSdk = 36",
                  text,
                  count=1,
          )
          elif gradle_groovy.exists():
              path = gradle_groovy
              text = path.read_text()
              text = re.sub(
                  r"compileSdk(?:Version)?\s+\S+",
                  "compileSdk 36",
                  text,
                  count=1,
              )
          else:
              raise SystemExit("Android app Gradle file was not found.")

          path.write_text(text)

          manifest_path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          manifest = manifest_path.read_text()
          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET" />'
          )

          if permission not in manifest:
              manifest = manifest.replace(
                  "<application",
                  f"{permission}\n\n    <application",
                  1,
              )

          manifest_path.write_text(manifest)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cystem-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

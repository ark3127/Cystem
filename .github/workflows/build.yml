name: Build CYSTEM APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Configure Android SDK and networking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          android_app = Path('android/app/build.gradle.kts')
          app_gradle = android_app.read_text()
          app_gradle = re.sub(
              r'compileSdk\s*=\s*[^\n]+',
              'compileSdk = 36',
              app_gradle,
              count=1,
          )
          android_app.write_text(app_gradle)

          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          manifest = manifest_path.read_text()
          permission = 'android.permission.INTERNET'
          if f'android:name="{permission}"' not in manifest:
              manifest = re.sub(
                  r'(?m)^(\s*)<application',
                  lambda match: f'    <uses-permission android:name="{permission}" />\n\n{match.group(1)}<application',
                  manifest,
                  count=1,
              )
          manifest_path.write_text(manifest)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Align Flutter plugin Android SDKs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pub_cache = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          patterns = (
              re.compile(r'(compileSdkVersion\s+)\d+'),
              re.compile(r'(compileSdk\s*=\s*)\d+'),
          )
          changed = []
          for gradle_file in pub_cache.glob('*/android/build.gradle*'):
              text = gradle_file.read_text()
              updated = text
              for pattern in patterns:
                  updated = pattern.sub(r'\g<1>36', updated)
              if updated != text:
                  gradle_file.write_text(updated)
                  changed.append(str(gradle_file))

          print('Updated Android compileSdk to 36 in:')
          for path in changed:
              print(f'  - {path}')
          PY

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cystem-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

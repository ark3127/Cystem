name: Build CYSTEM APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Configure Android networking and background execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          manifest = manifest_path.read_text()

          permissions = [
              'android.permission.INTERNET',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.WAKE_LOCK',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_DATA_SYNC',
              'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS',
          ]
          permission_block = '\n'.join(
              f'    <uses-permission android:name="{permission}" />'
              for permission in permissions
              if f'android:name="{permission}"' not in manifest
          )
          if permission_block:
              manifest = re.sub(
                  r'(?m)^(\s*)<application',
                  lambda match: f'{permission_block}\n\n{match.group(1)}<application',
                  manifest,
                  count=1,
              )

          service = '    <service android:name="de.julianassmann.flutter_background.IsolateHolderService" android:exported="false" android:foregroundServiceType="dataSync" />'
          if 'de.julianassmann.flutter_background.IsolateHolderService' not in manifest:
              manifest = re.sub(
                  r'(<application[^>]*>)',
                  lambda match: f'{match.group(1)}\n{service}',
                  manifest,
                  count=1,
              )

          manifest_path.write_text(manifest)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cystem-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

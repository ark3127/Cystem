name: cystem
description: A personal AI chat app powered by NVIDIA Nemotron.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Secure API key storage
  flutter_secure_storage: ^10.3.1

  # NVIDIA API requests
  http: ^1.6.0

  # Local chat storage
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

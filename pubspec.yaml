name: cystem
description: A personal Android AI assistant powered by NVIDIA Nemotron 3 Super via NVIDIA NIM.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Secure API key storage
  flutter_secure_storage: ^10.3.1

  # NVIDIA NIM, Gemini vision, and web search API requests
  http: ^1.6.0

  # Android background execution during generation
  flutter_background: ^1.3.1

  # Local chat storage
  path_provider: ^2.1.5

  # Markdown rendering
  flutter_markdown: ^0.7.7
  markdown: ^7.3.0

  # Camera/gallery image selection
  image_picker: ^1.1.2

  # Android phone/browser/SMS intents
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
